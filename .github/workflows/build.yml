name: Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon clean make

      - name: Build plugins.json
        run: ./gradlew --no-daemon makePluginsJson

      - name: Prepare builds directory
        run: |
          mkdir -p builds
          
          # Check if builds branch exists, create if not
          if git ls-remote --heads origin builds | grep -q builds; then
            git checkout builds || true
            git pull origin builds || true
            # Copy existing files if any
            cp -r builds/* ./ 2>/dev/null || true
          else
            git checkout --orphan builds
            git rm -rf . 2>/dev/null || true
          fi

      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy built plugins to builds branch'
